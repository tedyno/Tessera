name: Feature request
description: Suggest something Tessera should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        Describe the situation you are in, not only the feature you have in mind — the
        underlying problem often has a better solution than the one that first comes to mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like Tessera to do
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How you work around it today
      description: Another tool, a manual step, a SQL snippet you keep around.
