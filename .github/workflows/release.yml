name: Release

# Push a version tag (e.g. v0.2.0) to build the app, publish a DMG to a GitHub
# Release, and update the Sparkle appcast on GitHub Pages so existing installs can
# auto-update. Can also be run manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, publish DMG, update appcast
    runs-on: macos-latest
    env:
      # Set this repository secret to enable Sparkle signing + the appcast. Export it
      # once with:  Scripts/generate_keys && generate_keys -x sparkle_private_key
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Versions
        id: version
        run: |
          echo "short=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # No Apple certificate on CI, so the release is ad-hoc signed and un-notarized;
      # Sparkle's EdDSA signature is what secures the update itself.
      - name: Build (Release, universal)
        run: |
          set -euo pipefail
          xcodebuild -project Tessera.xcodeproj -scheme Tessera \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ steps.version.outputs.short }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            build

      - name: Package DMG
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Tessera.app"
          test -d "$APP"
          STAGING="$(mktemp -d)/Tessera"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Tessera" -srcfolder "$STAGING" \
            -ov -format UDZO "Tessera-${GITHUB_REF_NAME}.dmg"

      # Auto-update: EdDSA-sign the DMG and build the appcast (only when the key is set).
      # The appcast ships as a release asset; SUFeedURL points at .../releases/latest/
      # download/appcast.xml, which always resolves to the newest release.
      - name: Sign update and build appcast
        if: ${{ env.SPARKLE_ED_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          DMG="Tessera-${GITHUB_REF_NAME}.dmg"
          SIGN_UPDATE="$(find build/SourcePackages/artifacts -name sign_update -type f | head -1)"
          test -n "$SIGN_UPDATE"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > sparkle_private_key
          SIGNATURE="$("$SIGN_UPDATE" "$DMG" -f sparkle_private_key)"   # sparkle:edSignature="…" length="…"
          rm -f sparkle_private_key

          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${DMG}"
          PUBDATE="$(date -u +'%a, %d %b %Y %H:%M:%S +0000')"
          cat > appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>Tessera</title>
              <item>
                <title>Version ${{ steps.version.outputs.short }}</title>
                <pubDate>${PUBDATE}</pubDate>
                <sparkle:version>${{ steps.version.outputs.build }}</sparkle:version>
                <sparkle:shortVersionString>${{ steps.version.outputs.short }}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                <enclosure url="${URL}" ${SIGNATURE} type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          XML

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Tessera-${{ github.ref_name }}.dmg
            appcast.xml
          fail_on_unmatched_files: false
          generate_release_notes: true
          body: |
            A native macOS database client for PostgreSQL and MySQL.

            **Install:** download the DMG, open it, and drag **Tessera** to Applications.

            This build is **not notarized** (open-source project without a paid Apple
            Developer account), so macOS refuses it on the first try. To open it: launch
            once, then **System Settings → Privacy & Security → Open Anyway**. Or run:

            ```sh
            xattr -dr com.apple.quarantine /Applications/Tessera.app
            ```

            Once installed, future versions update automatically (Sparkle).
