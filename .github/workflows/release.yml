name: Release

# Push a version tag (e.g. v0.1.0) to build the app and publish a DMG to a GitHub
# Release. Can also be run manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # No Apple certificate on CI (it never leaves the maintainer's machine), so the
      # release is ad-hoc signed and un-notarized. macOS will warn on first launch;
      # the release notes tell users how to open it anyway.
      - name: Build (Release, universal, ad-hoc signed)
        run: |
          set -euo pipefail
          xcodebuild -project Tessera.xcodeproj -scheme Tessera \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            build

      - name: Package DMG
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Tessera.app"
          test -d "$APP"
          STAGING="$(mktemp -d)/Tessera"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Tessera" -srcfolder "$STAGING" \
            -ov -format UDZO "Tessera-${GITHUB_REF_NAME}.dmg"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Tessera-${{ github.ref_name }}.dmg
          generate_release_notes: true
          body: |
            A native macOS database client for PostgreSQL and MySQL.

            **Install:** download the DMG below, open it, and drag **Tessera** to
            Applications.

            This build is **not notarized** — Tessera is an open-source project without
            a paid Apple Developer account, so macOS will refuse it on the first try.
            To open it anyway: launch it once, then **System Settings → Privacy &
            Security → Open Anyway**. Or from Terminal:

            ```sh
            xattr -dr com.apple.quarantine /Applications/Tessera.app
            ```
