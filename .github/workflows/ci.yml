name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # No signing certificate on CI, and deliberately so — the release
      # certificate never leaves the maintainer's machine. Builds here are ad-hoc
      # signed, which is fine for verifying that the code compiles and passes.
      - name: Test the core
        run: swift test
        working-directory: TesseraCore

      - name: Build the app
        run: |
          xcodebuild -project Tessera.xcodeproj -scheme Tessera \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Automatic \
            build

      - name: Check third-party attribution
        run: Scripts/check-third-party-licenses.sh
